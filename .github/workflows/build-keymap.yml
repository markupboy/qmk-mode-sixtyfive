name: Build QMK Keymap

on:
  push:
    branches: [ main, master ]
    paths:
      - 'keymap*.c'
      - 'rules*.mk'
      - 'config.h'
      - 'Dockerfile'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'keymap*.c'
      - 'rules*.mk'
      - 'config.h'
      - 'Dockerfile'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [windows, mac]
    
    steps:
    - name: Checkout keymap repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
      
    - name: Build ${{ matrix.variant }} keymap with Docker
      run: |
        set -e  # Exit on any error
        mkdir -p build

        # For Windows variant, copy the Windows keymap file and gaming-optimized rules BEFORE docker build
        if [ "${{ matrix.variant }}" = "windows" ]; then
          echo "Setting up Windows variant files..."
          cp keymap_windows.c keymap.c
          cp rules_windows.mk rules.mk
          echo "Using gaming-optimized rules for Windows variant"
        else
          echo "Using default Mac variant files (keymap.c and rules.mk)"
        fi

        # Show which files will be compiled
        echo "=== keymap.c being compiled ==="
        head -30 keymap.c
        echo "=== rules.mk being used ==="
        cat rules.mk
        echo "==="

        # Build Docker image with the correct variant files
        docker build -t qmk-markupboy-${{ matrix.variant }} .

        # Run compilation
        docker run --rm -v ${PWD}/build:/output qmk-markupboy-${{ matrix.variant }} bash -c "
          set -e
          qmk compile -kb mode/m256wh -km markupboy
          echo 'Compiled firmware files:'
          find /qmk_firmware -name 'mode_m256wh_markupboy.*' -type f
          cp /qmk_firmware/mode_m256wh_markupboy.* /output/ || find /qmk_firmware -name 'mode_m256wh_markupboy.*' -type f -exec cp {} /output/ \;
        "

        # Verify files were created
        echo "Files in build directory:"
        ls -la build/

        # Rename files with variant suffix
        for file in build/mode_m256wh_markupboy.*; do
          if [ -f "$file" ]; then
            extension="${file##*.}"
            mv "$file" "build/mode_m256wh_markupboy_${{ matrix.variant }}.${extension}"
          fi
        done

        # Verify renamed files
        echo "Renamed files:"
        ls -la build/
        
    - name: List build artifacts
      run: |
        echo "Built firmware files for ${{ matrix.variant }}:"
        find build/ -name "mode_m256wh_markupboy_${{ matrix.variant }}.*" -type f 2>/dev/null || echo "No firmware files found"
        ls -la build/
        
    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v4
      with:
        name: qmk-firmware-markupboy-${{ matrix.variant }}-${{ github.sha }}
        path: |
          build/mode_m256wh_markupboy_${{ matrix.variant }}.*
        retention-days: 30

  release:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout keymap repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts/
        
    - name: Prepare release files
      run: |
        set -e
        mkdir -p release/

        echo "Downloaded artifacts structure:"
        find artifacts/ -type f

        echo "Copying Windows firmware..."
        cp artifacts/qmk-firmware-markupboy-windows-${{ github.sha }}/mode_m256wh_markupboy_windows.* release/

        echo "Copying Mac firmware..."
        cp artifacts/qmk-firmware-markupboy-mac-${{ github.sha }}/mode_m256wh_markupboy_mac.* release/

        echo "Release files:"
        ls -la release/
        
    - name: Generate release tag
      id: tag
      run: |
        echo "tag=v$(date +'%Y%m%d-%H%M%S')-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.tag.outputs.tag }}
        name: "QMK mode/m256wh - markupboy ${{ steps.tag.outputs.tag }}"
        body: |
          ## QMK Firmware Build
          
          **Keyboard:** Mode M256WH  
          **Keymap:** markupboy (Windows & Mac variants)  
          **Commit:** ${{ github.sha }}  
          **Built:** ${{ github.run_id }}
          
          ### Files
          - `mode_m256wh_markupboy_windows.bin` - Windows variant firmware
          - `mode_m256wh_markupboy_mac.bin` - Mac variant firmware
          
          ### Key Differences
          **Windows variant:**
          - Standard Ctrl/Alt layout
          - Ctrl+C/V/Z shortcuts on Layer 2
          
          **Mac variant:**
          - Command (⌘) and Option (⌥) key layout
          - Cmd+C/V/Z shortcuts on Layer 2
          - Alt/GUI keys swapped for Mac convention
          
          ### How to Flash
          1. Download the appropriate `.bin` file for your OS
          2. Use [QMK Toolbox](https://github.com/qmk/qmk_toolbox) or your preferred flashing tool
          3. Flash the firmware to your keyboard
        files: |
          release/*
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}